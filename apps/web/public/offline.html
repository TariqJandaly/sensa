<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>سنسا · غير متصل</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, sans-serif;
        background: #f5f2ea;
        color: #1e2b26;
      }
      .box {
        max-width: 420px;
        padding: 2rem;
        background: #fff;
        border: 1px solid #e5e0d1;
        border-radius: 16px;
        box-shadow: 0 12px 30px -14px rgba(30, 43, 38, 0.18);
        text-align: center;
      }
      .ring {
        width: 88px;
        height: 88px;
        margin: 0 auto 1.25rem;
        border-radius: 50%;
        border: 6px solid #0e6653;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        font-weight: 800;
        color: #0e6653;
      }
      h1 { font-size: 1.35rem; margin: 0 0 0.5rem; }
      p { margin: 0; color: #5b685f; line-height: 1.8; }
    </style>
  </head>
  <body>
    <main class="box">
      <div class="ring">س</div>
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>
        سنسا تعمل عند الاتصال بالشبكة. سيتم تنبيه الساعة فور عودة الاتصال، وستظهر آخر القراءات هنا.
      </p>
    </main>
  </body>
</html>
